name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check description-loader.js
          node --check workout-categories.js
          node --check sw.js
          node --check publisering/app.js
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Check whitespace errors
        run: git diff --check HEAD
